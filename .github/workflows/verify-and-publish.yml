name: Verify and publish C-DROHNE

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: c-drohne-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run qa:offline
      - run: npm run verify:manifest

  publish:
    if: github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish the verified dist tree to the configured Pages branch
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/c-drohne-pages" origin/gh-pages
          rsync -a --delete --exclude='.git' dist/ "$RUNNER_TEMP/c-drohne-pages/"
          cd "$RUNNER_TEMP/c-drohne-pages"
          git add -A
          if git diff --cached --quiet; then
            echo 'Pages already matches dist.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish verified C-DROHNE site'
          git push origin HEAD:gh-pages
